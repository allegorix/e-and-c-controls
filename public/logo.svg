    <!-- Middle Bar of E -->
    <rect x="52" y="92" width="108" height="22" rx="11" fill="#DCE6F8" />
    
    <!-- Bottom Bar of E -->
    <path d="M 32 120 C 32 135 44 144 62 144 H 192 V 120 Z" fill="#DCE6F8" />
    
    <!-- Lightning Bolt (Orange) -->
    <polygon points="202,62 162,112 238,112 198,154 200,154 202,154" fill="none" />
    <path d="M 202 62 L 162 112 H 238 L 198 154 L 204 112 H 162 Z" fill="none" />
    <path d="M 202 62 L 162 112 H 238 L 198 154 L 238 102 H 178 Z" fill="#F15A24" />
