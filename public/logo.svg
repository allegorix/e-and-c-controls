<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" fill="none">
  <!-- Symbol Group -->
  <g id="logo-mark">
    <!-- Top Bar of 'E' Symbol (Light Ice Blue #DCE6F8) -->
    <path d="M 50 20 C 30 20 18 30 18 44 H 194 L 182 20 Z" fill="#DCE6F8" />
    
    <!-- Middle Bar & Bottom Ribbon Loop of 'E' Symbol (Light Ice Blue #DCE6F8) -->
    <path d="M 50 60 H 148 V 80 H 50 C 38 80 34 84 34 90 C 34 96 38 100 50 100 H 170 V 120 H 54 C 26 120 18 104 18 90 C 18 74 28 60 50 60 Z" fill="#DCE6F8" />

    <!-- Lightning Bolt (Electric Orange #F15A24) -->
    <polygon points="204,18 162,70 238,70 196,124 226,62 174,62" fill="#F15A24" />
  </g>

  <!-- Text Group -->
  <g id="logo-text">
    <!-- E&C Text (Electric Orange #F15A24) -->
    <text x="252" y="78" font-family="'Montserrat', 'Arial Black', 'Impact', system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#F15A24" letter-spacing="-1.5">E&amp;C</text>
    
    <!-- CONTROLS Text (Periwinkle Blue #98A5F8) -->
    <text x="254" y="112" font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', system-ui, sans-serif" font-weight="800" font-size="27" fill="#98A5F8" letter-spacing="4">CONTROLS</text>
  </g>
</svg>
