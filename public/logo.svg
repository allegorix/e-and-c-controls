    <!-- Top Bar with angled right edge cut -->
    <path d="M 54 18 C 28 18 16 34 16 54 L 16 86 C 16 106 28 122 54 122 H 194 L 204 100 H 54 C 42 100 36 92 36 82 L 36 74 H 146 V 62 H 36 L 36 54 C 36 44 42 38 54 38 H 184 L 194 18 Z" fill="#DCE6F8" />

